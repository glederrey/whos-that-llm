name: Database dry run

# Run by hand from the Actions tab. It connects to the production database with
# the SUPABASE_DB_URL secret (the session pooler string, which works over IPv4)
# and previews the pending migrations with `supabase db push --dry-run`. It
# changes nothing and never touches Vercel. Use it to check the secret before a
# release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.121.0

      - name: Preview the database migrations
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
