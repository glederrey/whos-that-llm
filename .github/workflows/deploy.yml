name: Deploy

# Production deploy runs only when a GitHub Release is published.
# App env stays on the Vercel project, not in this workflow:
# NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, SUPABASE_SECRET_KEY,
# OPENROUTER_API_KEY, OPENROUTER_MANAGEMENT_KEY.
# OPENROUTER_MANAGEMENT_KEY stays a Production Secret. vercel pull writes the
# placeholder [SENSITIVE] for secrets, and the following step deletes those
# lines so the build does not load them. The deployment still receives the
# project secret at runtime.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production

      - name: Drop redacted secret placeholders
        run: node scripts/strip-sensitive-placeholders.mjs

      - name: Build
        run: vercel build --prod --standalone

      - name: Check prebuilt output
        run: |
          du -sh .vercel/output
          find .vercel/output -type f | wc -l
          find .vercel/output -type l | wc -l

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --archive=tgz
