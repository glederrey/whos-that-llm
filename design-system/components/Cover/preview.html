<!-- @dsCard height=300 -->
<div class="cv">
<style>
.cv{position:relative;width:960px;height:300px;background:var(--canvas);overflow:hidden;font-family:var(--font-display)}
.cv svg{position:absolute;left:0;top:0}
.cv .slab{fill:var(--text)}
.cv .head{fill:var(--teal)}
.cv .tint{fill:var(--player)}
.cv .deep{fill:var(--teal-deep)}
.cv .pip-on{fill:var(--teal)}
.cv .pip{fill:none;stroke:color-mix(in srgb, var(--canvas) 45%, var(--text));stroke-width:2.5}
.cv .eye{fill:var(--paper)}
.cv .txt{position:absolute;left:44px;bottom:40px;max-width:440px}
.cv h1{margin:0;font-size:72px;line-height:.95;font-weight:800;letter-spacing:-0.03em;color:var(--text)}
.cv p{margin:14px 0 0;font:400 14px/1.4 var(--font-sans);color:var(--mute)}
</style>
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
<!--
blocks: hidden 380x196 (the logo's bubble, radius-bubble with a radius-tail corner), teal 168x128 robot head (radius-control x2), player 220x64 tint bleeding off the top, teal-deep 48x48 key
arrangement: one tall slab with satellites; slab from x=500, head overlapping its lower right, tint bleeding off the top edge
pattern: literal motif row, antenna dots: ten message pips across the slab, four filled, because the round is counted in these dots
scales: pip pitch space-6 (24px + 4), r 7; corners radius-bubble 22, radius-tail 4, radius-control 12 doubled to 24
-->
<rect class="tint" x="640" y="-20" width="220" height="64" rx="22"/>
<rect class="slab" x="500" y="56" width="380" height="196" rx="22"/>
<rect class="slab" x="500" y="212" width="48" height="56" rx="4"/>
<g>
<circle class="pip-on" cx="548" cy="104" r="7"/><circle class="pip-on" cx="576" cy="104" r="7"/><circle class="pip-on" cx="604" cy="104" r="7"/><circle class="pip-on" cx="632" cy="104" r="7"/>
<circle class="pip" cx="660" cy="104" r="7"/><circle class="pip" cx="688" cy="104" r="7"/><circle class="pip" cx="716" cy="104" r="7"/><circle class="pip" cx="744" cy="104" r="7"/><circle class="pip" cx="772" cy="104" r="7"/><circle class="pip" cx="800" cy="104" r="7"/>
</g>
<rect class="head" x="760" y="168" width="168" height="128" rx="24"/>
<rect class="eye" x="800" y="204" width="24" height="24" rx="4"/><rect class="eye" x="864" y="204" width="24" height="24" rx="4"/>
<rect class="deep" x="580" y="168" width="48" height="48" rx="12"/>
</svg>
<div class="txt"><h1>Who's that<br>LLM?</h1><p>A hidden model answers. Ten messages to name it.</p></div>
</div>
